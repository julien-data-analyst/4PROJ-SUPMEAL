<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarte aux pommes — SUPMEAL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="main" style="max-width:900px;margin:0 auto;padding:26px 24px 60px;">

  <div class="topbar">
    <div class="topbar-left">
      <a href="recherche.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </a>
    </div>
    <div class="topbar-right">
      <button class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importer dans mes recettes
      </button>
    </div>
  </div>

  <div style="margin-bottom:16px;">
    <h1 class="text-title2" style="margin-bottom:6px;">Tarte aux pommes</h1>
    <div class="flex items-center gap-8">
      <span class="badge badge-gray-outline">Publique</span>
      <span class="recipe-meta-sub">par Marie Dupont</span>
    </div>
  </div>

  <div class="editor-body">
    <h2>Ingrédients</h2>
    <ul>
      <li>4 pommes</li>
      <li>200g de farine</li>
      <li>100g de sucre</li>
    </ul>
    <h2>Étapes</h2>
    <h3>1. Préparation</h3>
    <p>Épluchez et coupez les pommes.</p>
    <h3>2. Cuisson</h3>
    <p>Enfournez 30 minutes à 180°C.</p>
  </div>

  <div class="readonly-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Vous n'avez pas la permission de modifier cette recette.
  </div>

</div>
