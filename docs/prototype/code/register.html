<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — SUPMEAL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card" style="max-width:420px;">
    <div class="logo">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#84FA16"/>
            <stop offset="100%" stop-color="#2AC204"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="letters">SU</span>
      <svg class="pan-icon" viewBox="0 0 24 24"><circle cx="14" cy="12" r="7" fill="url(#logoGrad)"/><rect x="1" y="10.5" width="10" height="3" rx="1.5" fill="url(#logoGrad)" transform="rotate(-14 6 12)"/></svg>
      <span class="letters">MEA</span>
      <svg class="knife-icon" viewBox="0 0 24 24"><rect x="3" y="2" width="5" height="13" rx="2" fill="url(#logoGrad)"/><path d="M3 15 L21 15 L3 20 Z" fill="url(#logoGrad)"/></svg>
    </div>
    <p class="tagline">Vos recettes, cookbooks &amp; plannings au même endroit</p>

    <p class="heading">Créer un compte</p>
    <p class="sub-heading">Rejoignez la communauté SUPMEAL</p>

    <div class="oauth-row">
      <button class="oauth-btn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47c-.28 1.48-1.13 2.73-2.4 3.58v2.98h3.88c2.27-2.09 3.54-5.17 3.54-8.8z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-2.98c-1.08.72-2.45 1.15-4.05 1.15-3.11 0-5.75-2.1-6.69-4.92H1.3v3.08C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.31 14.34A7.19 7.19 0 0 1 4.93 12c0-.81.14-1.6.38-2.34V6.58H1.3A11.98 11.98 0 0 0 0 12c0 1.93.46 3.76 1.3 5.42l4.01-3.08z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.3 6.58l4.01 3.08c.94-2.82 3.58-4.91 6.69-4.91z"/></svg>
        Google
      </button>
      <button class="oauth-btn">
        <svg viewBox="0 0 23 23"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="12" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="12" width="10" height="10" fill="#00A4EF"/><rect x="12" y="12" width="10" height="10" fill="#FFB900"/></svg>
        Microsoft
      </button>
    </div>

    <div class="divider-row"><div class="line"></div><span>OU PAR EMAIL</span><div class="line"></div></div>

    <form onsubmit="return false;">
      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input class="input" type="text" id="username" placeholder="johndoe">
      </div>

      <div class="field">
        <label for="email">Adresse email</label>
        <input class="input" type="email" id="email" placeholder="john.doe@email.com">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input class="input" type="password" id="password" placeholder="••••••••">
            <button type="button" data-toggle-password aria-label="Afficher le mot de passe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="password2">Confirmation</label>
          <div class="password-field">
            <input class="input" type="password" id="password2" placeholder="••••••••">
            <button type="button" data-toggle-password aria-label="Afficher le mot de passe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <label class="flex items-center gap-8 mb-0" style="font-size:12px;color:var(--text-muted);margin-bottom:20px;">
        <input type="checkbox"> J'accepte les <a href="#" style="color:var(--accent);font-weight:600;">conditions d'utilisation</a>
      </label>

      <button class="btn btn-primary w-full" style="padding:11px;">Créer mon compte</button>
    </form>

    <p class="auth-foot">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
