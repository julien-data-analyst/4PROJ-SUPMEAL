# Local hooks run inside the dev containers (docker-compose.dev.yml), so:
#   docker compose -f docker-compose.dev.yml up -d
# must be running (backend + frontend services healthy) before `git commit`.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- Generic hygiene checks (whole repo, no container needed) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/(\.nuxt/|tsconfig.*\.json$)
      - id: mixed-line-ending

  - repo: local
    hooks:
      # --- Python / Django backend (ran inside the `backend` container) ---
      - id: ruff-lint
        name: ruff lint (backend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T backend uv run ruff check --fix --exit-non-zero-on-fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format (backend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T backend uv run ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: basedpyright
        name: basedpyright (backend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T backend uv run basedpyright
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      # --- Nuxt / frontend (ran inside the `frontend` container) ---
      - id: eslint
        name: eslint (frontend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T frontend npm run lint:fix
        language: system
        files: ^frontend/.*\.(js|ts|mjs|cjs|vue)$
        exclude: ^frontend/\.nuxt/
        pass_filenames: false

      - id: prettier
        name: prettier check (frontend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T frontend npx prettier --check .
        language: system
        files: ^frontend/.*\.(js|ts|mjs|cjs|vue|json|css|md)$
        exclude: ^frontend/(\.nuxt/|package-lock\.json)
        pass_filenames: false

      - id: nuxt-typecheck
        name: nuxt typecheck (frontend, docker)
        entry: docker compose -f docker-compose.dev.yml exec -T frontend npm run typecheck
        language: system
        files: ^frontend/.*\.(ts|vue)$
        exclude: ^frontend/\.nuxt/
        pass_filenames: false
        stages: [pre-push]
